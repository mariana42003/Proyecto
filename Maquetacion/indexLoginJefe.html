<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kronos - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-11 col-lg-9 col-xl-8"> 

                <div class="cajaGrande shadow-lg rounded-4 overflow-hidden bg-white">
                    <div class="row g-0 align-items-stretch"> 
                        
                        <div class="col-md-6 d-none d-md-block p-0"> 
                            <img src="img/fonditos.png" alt="Herramientas" class="img-fluid w-100 h-100" style="object-fit: cover;"> 
                        </div>

                        <div class="col-12 col-md-6 p-4 p-sm-5 d-flex flex-column justify-content-center  contenedorI"> 

                            <div class="botonSalir mb-1">
                                <a href="/index.html" class="btn btn-light rounded-circle shadow-sm">
                                    <i class="bi bi-arrow-left"></i>
                                </a>
                            </div>

                            <div class="text-center mb-4">
                                <img src="img/logo.png" alt="Logo Kronos" class="img-fluid" style="max-height: 100px;">
                            </div>

                            <div class="iniciarSesion w-100">
                                <form action="pagesLogin/pagina2.html">
                                    <div class="mb-3">
                                        <label for="usuarioI" class="form-label">
                                            <span>Usuario</span> <i class="bi bi-person-fill"></i>
                                        </label>
                                        <input type="email" id="usuarioI" class="form-control usuContra" placeholder="Ingrese su correo electronico" required> 
                                    </div>

                                    <div class="mb-4">
                                        <label for="contraseña" class="form-label">
                                            <span>Contraseña</span> <i class="bi bi-eye"></i>
                                        </label>
                                        <input type="password" id="contraseña" class="form-control usuContra" placeholder="Ingrese su contraseña" required> 
                                    </div>

                                    <button type="button" class="btn-iniciarSesion  btn-alarmas">Iniciar sesión</button>
                                </form>
                            </div>

                            <div class="OR d-flex justify-content-between mt-4 w-100"> 
                                <a href="pagesLogin/olvidoContra.html" class="small">Olvidé mi contraseña</a>
                                <a href="pagesLogin/registrarse.html" class="small">Registrarse</a>
                            </div>
                        </div> 
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/kronos.js"></script>
</body>
</html>
