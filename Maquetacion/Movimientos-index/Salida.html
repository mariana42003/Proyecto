<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Bootstrap 5-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"/>

    <!--Font Awesome-->

    <script
      src="https://kit.fontawesome.com/a0994db117.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="../css/Entrada.css" />

    <!--DataTables Bootstrap-->

    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <title>Panel de Control</title>
  </head>

  <body>
    <div class="contenedor">
      <!-- -- HEADER PRINCIPAL -- -->

      <header>
        <h1 class="nombreUsuario">
          <i class="bi bi-person-circle"></i>
        </h1>

        <img src="../img/logo.png" alt="Logo" />

   
        <div class="cerrarSesion">
        <a href="#" id="btnSalir">
          <i class="bi bi-box-arrow-right"></i>
        </a>
        </div>
      </header>

      <!-- -- MENU LATERAL -- -->

      <aside>
        <div class="opciones">
          <!-- -- PANEL DE CONTROL -- -->

          <a href="../Panel.html">
            <i class="bi bi-eye"></i>
            Panel de control
          </a>

          <!-- -- GESTION DE INVENTARIO -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-inventario"
              class="radio-check"
            />

            <label for="check-inventario" class="titulo-menu">
              <i class="bi bi-box-seam"></i>
              Gestión de Inventario
            </label>

            <div class="submenu">
              <a href="../gestionInventario/stock.html">
                <i class="bi bi-journal-text"></i>
                Stock
              </a>

              <a href="../gestionInventario/reportes.html">
                <i class="bi bi-pencil"></i>
                Reportes
              </a>
            </div>
          </div>

          <!-- -- MOVIMIENTOS DE ENTRADA Y SALIDA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-movimientos"
              class="radio-check"
            />

            <label for="check-movimientos" class="titulo-menu">
              <i class="bi bi-cart"></i>
              Movimientos de entrada/salida
            </label>

            <div class="submenu">
              <a href="../Movimientos-index/Entrada.html">
                <i class="bi bi-box-arrow-in-down"></i>
                Registro de Entradas
              </a>

              <a href="../Movimientos-index/Salida.html">
                <i class="bi bi-box-arrow-up"></i>
                Registro de Salidas
              </a>
            </div>
          </div>

          <!-- -- PROVEEDORES -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-proveedores"
              class="radio-check"
            />

            <label for="check-proveedores" class="titulo-menu">
              <i class="bi bi-people"></i>
              Proveedores
            </label>

            <div class="submenu">
              <a href="../Pagesjefe/registrarProveedore.html">
                <i class="bi bi-card-list"></i>
                Registrar
              </a>


            </div>
          </div>

          <!-- -- ORDEN DE COMPRA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-ordenes"
              class="radio-check"
            />

            <label for="check-ordenes" class="titulo-menu">
              <i class="bi bi-file-earmark-arrow-down"></i>
              Generar orden de compra
            </label>

            <div class="submenu">
              <a href="../pagesJefe/historialCompras.html">
                <i class="bi bi-journal-check"></i>
                Historial compras
              </a>

              <a href="../pagesJefe/materialCantidad.html">
                <i class="bi bi-boxes"></i>
                Asociar materiales
              </a>

              <a href="../pagesJefe/verificarEstado.html">
                <i class="bi bi-arrow-repeat"></i>
                Verificar estado
              </a>
            </div>
          </div>

          <!-- -- GARANTIAS -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-garantias"
              class="radio-check"
            />

            <label for="check-garantias" class="titulo-menu">
              <i class="bi bi-shield-check"></i>
              Garantías
            </label>

            <div class="submenu">
              <a href="../Garantias/SolicitudGarantias.html">
                <i class="bi bi-pencil-square"></i>
                Solicitudes de Garantía
              </a>

              <a href="../Garantias/consultarOrden.html">
                <i class="bi bi-file-earmark-text"></i>
                Consultar Orden
              </a>

              <a href="../Garantias/historial-garantias.html">
                <i class="bi bi-clock-history"></i>
                Historial
              </a>

              <a href="../Garantias/estado-gar-provee.html">
                <i class="bi bi-arrow-left-right"></i>
                Estado Garantía
              </a>
            </div>
          </div>
        </div>
      </aside>

      <!-- -- CONTENIDO PRINCIPAL -- -->
      <main>
        <h2 class="titulo"><i class="bi bi-box-arrow-in-up"></i> Salida de Material </h2>

        <form action="" class="formulario p-4">
  <div class="row">
    
    <div class="col-md-6">
      
      <div class="mb-3">
        <label class="form-label">Nombre del Material <i class="bi bi-search"></i></label>
        <input type="text" class="form-control" placeholder="Ingrese nombre del material">
      </div>

      <div class="mb-3">
        <label class="form-label">Marca</label>
        <input type="text" class="form-control" placeholder="Ingrese la marca">
      </div>

      <div class="mb-3">
        <label class="form-label">Modelo/Referencia</label>
        <input type="text" class="form-control" placeholder="Ingrese modelo o referencia">
      </div>

      <div class="mb-3">
        <label class="form-label">Categoria</label>
        <select class="form-select">
          <option selected>Tornillería</option>
          <option value="1">Herramientas</option>
        </select>
      </div>

    </div>

    <div class="col-md-6">
      
      <div class="mb-3">
        <label class="form-label">Unidad de Medida</label>
        <select class="form-select">
          <option selected>Pieza</option>
          <option value="1">Metros</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Cantidad a retirar</label>
        <input type="number" class="form-control" value="0">
      </div>

      <div class="mb-3">
        <label class="form-label">Responsable</label>
        <input type="number" class="form-control" value="0">
      </div>

    </div>

  </div>
</form>
        <div id="boton">
          <button class="confirmarSalida"><i class="bi bi-patch-check-fill"></i>  Confirmar</button>
          <button class="cancelarSalida"><i class="bi bi-trash-fill"></i> Cancelar</button>     
        </div>
      </main>
    </div>

   <!-- Alertas -->
     
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- JQuery, requerido para los DataTables -->
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"></script>
    <!-- Para que funcione el DataTable -->
    <script src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scrip mio -->

    <script src="../js/jefe-proveedores.js"></script>
        <script src="../js/FuncionesPanel.js"></script>

  </body>
</html>
