<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="../css/ConsultarOrden.css">

    <title>Consultar Garantía</title>
</head>

<body class="fondo">

<input type="checkbox" id="menu">

<label for="menu" class="menus">
    <i class="bi bi-list"></i>
</label>

<div class="contenedor container-fluid p-0">

    <!-- HEADER -->
    <header class="w-100">

        <h1 class="nombreUsuario">
            <i class="bi bi-person-circle"></i>
        </h1>

        <img src="../img/logo.png" alt="Logo">

         <div class="cerrarSesion">
                <a href="#" id="btnSalir">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>

    </header>

    <!-- CONTENEDOR DEL ASIDE Y MAIN -->
    <div class="d-flex align-items-stretch w-100 posicion-contenedor">

        <!-- ASIDE -->
      <aside>
        <div class="opciones">
          <!-- -- PANEL DE CONTROL -- -->

          <a href="../Panel.html">
            <i class="bi bi-eye"></i>
            Panel de control
          </a>

          <!-- -- GESTION DE INVENTARIO -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-inventario"
              class="radio-check"
            />

            <label for="check-inventario" class="titulo-menu">
              <i class="bi bi-box-seam"></i>
              Gestión de Inventario
            </label>

            <div class="submenu">
              <a href="../gestionInventario/stock.html">
                <i class="bi bi-journal-text"></i>
                Stock
              </a>

              <a href="../gestionInventario/reportes.html">
                <i class="bi bi-pencil"></i>
                Reportes
              </a>
            </div>
          </div>

          <!-- -- MOVIMIENTOS DE ENTRADA Y SALIDA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-movimientos"
              class="radio-check"
            />

            <label for="check-movimientos" class="titulo-menu">
              <i class="bi bi-cart"></i>
              Movimientos de entrada/salida
            </label>

            <div class="submenu">
              <a href="../Movimientos-index/Entrada.html">
                <i class="bi bi-box-arrow-in-down"></i>
                Registro de Entradas
              </a>

              <a href="../Movimientos-index/Salida.html">
                <i class="bi bi-box-arrow-up"></i>
                Registro de Salidas
              </a>
            </div>
          </div>

          <!-- -- PROVEEDORES -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-proveedores"
              class="radio-check"
            />

            <label for="check-proveedores" class="titulo-menu">
              <i class="bi bi-people"></i>
              Proveedores
            </label>

            <div class="submenu">
              <a href="../Pagesjefe/registrarProveedore.html">
                <i class="bi bi-card-list"></i>
                Registrar
              </a>


            </div>
          </div>

          <!-- -- ORDEN DE COMPRA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-ordenes"
              class="radio-check"
            />

            <label for="check-ordenes" class="titulo-menu">
              <i class="bi bi-file-earmark-arrow-down"></i>
              Generar orden de compra
            </label>

            <div class="submenu">
              <a href="../pagesJefe/historialCompras.html">
                <i class="bi bi-journal-check"></i>
                Historial compras
              </a>

              <a href="../pagesJefe/materialCantidad.html">
                <i class="bi bi-boxes"></i>
                Asociar materiales
              </a>

              <a href="../pagesJefe/verificarEstado.html">
                <i class="bi bi-arrow-repeat"></i>
                Verificar estado
              </a>
            </div>
          </div>

          <!-- -- GARANTIAS -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-garantias"
              class="radio-check"
            />

            <label for="check-garantias" class="titulo-menu">
              <i class="bi bi-shield-check"></i>
              Garantías
            </label>

            <div class="submenu">
              <a href="../Garantias/SolicitudGarantias.html">
                <i class="bi bi-pencil-square"></i>
                Solicitudes de Garantía
              </a>

              <a href="../Garantias/consultarOrden.html">
                <i class="bi bi-file-earmark-text"></i>
                Consultar Orden
              </a>

              <a href="../Garantias/historial-garantias.html">
                <i class="bi bi-clock-history"></i>
                Historial
              </a>

              <a href="../Garantias/estado-gar-provee.html">
                <i class="bi bi-arrow-left-right"></i>
                Estado Garantía
              </a>
            </div>
          </div>
        </div>
      </aside>
      

        <!-- MAIN -->
        <main class="flex-grow-1 p-3 p-md-5 overflow-hidden">

            <div class="card shadow-sm border-0 mb-4 form-consulta-card">

                <div class="card-header text-center bg-kronos-banner py-3">
                    <h2 class="mb-0 titulo-consulta">
                        Consultar Orden de Compra
                    </h2>
                </div>

                <div class="card-body p-4">

                    <form>

                        <div class="row g-4">

                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Número de orden
                                    <i class="bi bi-123"></i>
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Ingrese el número de orden">
                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Cliente
                                    <i class="bi bi-person"></i>
                                </label>

                                <input type="text"
                                       class="form-control"
                                       placeholder="Ingrese el nombre del cliente">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Fecha
                                    <i class="bi bi-calendar3"></i>
                                </label>

                                <input type="date"
                                       class="form-control">

                            </div>

                        </div>

                        <div class="mt-4 d-flex gap-3">

                            <button class="btn btn-kronos-search px-4 fw-bold">
                                <a href="/Garantias/simulacion-consulta.html">Buscar</a>
                            </button>

                            <button type="reset"
                                    class="btn btn-kronos-clear px-4 fw-bold">
                                <a href="/Garantias/consultarOrden.html">Limpiar</a>
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/jefe-proveedores.js"></script>


</body>
</html>
