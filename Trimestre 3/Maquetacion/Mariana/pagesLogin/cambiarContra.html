<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="nuevaContraseña shadow-sm">
                    <img src="../img/logo.png" alt="Logo Kronos">
                    
                    <div class="volverAnterior">
                      <a href="../pagesLogin/restablecimientoContra.html" class="btn-volver">
                        <i class="bi bi-chevron-double-left"></i>   
                        Volver
                      </a>
                    </div>

                    <hr>

                    <h1>Restablecimiento de contraseña</h1>
                    
                    <div class="cajaGrande">
                        <form action="../indexLoginJefe.html">
                            <div class="pinRestablecimiento">
                                <label for="usuario">Usuario <i class="bi bi-person-fill"></i></label>
                                <input type="text" id="usuario" minlength="3" maxlength="15" placeholder="Ingrese su NIT o numero de identificacion" required>

                                <label for="pin">PIN de restablecimiento <i class="bi bi-shield-lock-fill"></i></label>
                                <input type="text" id="pin" minlength="2" maxlength="4" placeholder="Ingrese el PIN de restablecimiento" required>

                                <label for="nuevaContra">Nueva contraseña <i class="bi bi-key-fill"></i></label>
                                <input type="password" id="nuevaContra" minlength="3" maxlength="16" placeholder="Ingrese su nueva contraseña" required>
                            </div>

                            <div class="btn-confirmarR">
                                <button type="submit">Confirmar cambios</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
