<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Kronos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="../css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="contenedorR shadow-sm">
                    <img src="../img/logo.png" alt="Logo">
                    <h1>Registrarse</h1>

                    <form action="../indexLoginJefe.html">
                        <label for="nombre">Nombre <i class="bi bi-tag"></i></label>
                        <input type="text" id="nombre" placeholder="Ingrese el nombre" required>

                        <label for="usuario">Usuario <i class="bi bi-person-circle"></i></label>
                        <input type="text" id="usuario" placeholder="Ingrese su NIT o número de identificación" required>
                         
                        <label for="correo">Correo electrónico <i class="bi bi-envelope"></i></label>  
                        <input type="email" id="correo" placeholder="Ingrese su correo electrónico" required>  
                        
                        <label for="telefono">Teléfono <i class="bi bi-telephone"></i></label>    
                        <input type="text" id="telefono" placeholder="Ingrese su número de teléfono" required>  
                        
                        <label for="direccion">Dirección <i class="bi bi-geo-alt"></i></label>   
                        <input type="text" id="direccion" placeholder="Ingrese su dirección" required>  
                         
                        <h1 class="mt-4">Contraseña</h1>
            
                        <label for="contraseña">Contraseña <i class="bi bi-lock"></i></label>
                        <input type="password" id="contraseña" placeholder="Ingrese su contraseña" required>

                        <label for="confirmarContraseña">Confirmar Contraseña <i class="bi bi-lock-fill"></i></label>
                        <input type="password" id="confirmarContraseña" placeholder="Confirme su contraseña" required>
                     
                        <button type="submit">Confirmar Registro</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="../indexLoginJefe.html" class="btn-volver-inicio btn btn-light border w-100 py-2 fw-bold text-primary">Volver al inicio</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
