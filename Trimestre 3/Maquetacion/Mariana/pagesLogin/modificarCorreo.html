<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Correo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="arreglarCorreo shadow-sm">
                    <img src="../img/logo.png" alt="Logo Kronos">

                    <div class="volverAnterior">
                      <a href="../pagesLogin/restablecimientoContra.html" class="btn-volver">
                        <i class="bi bi-chevron-double-left"></i>   
                        Volver
                      </a>
                    </div>

                    <div class="decoracion">
                        <h1>Actualizar correo electrónico</h1>
                    </div>

                    <p class="text-center "> <b>Si ya no tiene acceso a su correo electrónico, complete el formulario para actualizar la dirección de correo asociada a su cuenta.</b></p>
                    <br><br>
                    
                    <form action="../pagesLogin/olvidoContra.html">
                        <label for="usuario">Usuario <i class="bi bi-person-circle"></i></label>
                        <input type="text" id="usuario" placeholder="Ingrese su NIT o numero de identificacion" required>

                        <label for="correo">Nuevo correo electronico <i class="bi bi-envelope-plus"></i></label>  
                        <input type="email" id="correo" placeholder="Ingrese su correo electronico" required>  
                        
                        <label for="correoConfirmar">Confirmar nuevo correo electronico <i class="bi bi-envelope-exclamation-fill"></i></label>  
                        <input type="email" id="correoConfirmar" placeholder="Ingrese su correo electronico" required>      
                        
                        <div class="btn-botones">
                        <button type="submit" class="fs-6  py-6 mb-0" > ⮊  Actualización de correo electrónico  ⮈</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
