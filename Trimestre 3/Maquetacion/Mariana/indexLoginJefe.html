<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kronos - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="contenedorIS shadow-sm">

                    <div class="d-flex justify-content-start p-3 pb-0">
                        <a href="index.html" class="btn btn-light rounded-circle shadow-sm">
                            <i class="bi bi-arrow-left"></i>
                        </a>
                    </div>

                    <img src="img/logo.png" alt="Logo Kronos">

                    <div class="iniciarSesion">
                        <form action="pagesLogin/pagina2.html">

                            <label for="usuarioI">
                                Usuario <i class="bi bi-person-fill"></i>
                            </label>

                            <input
                                type="text"
                                id="usuarioI"
                                minlength="3"
                                maxlength="15"
                                placeholder="Ingrese su número de identificación"
                                required
                            >

                            <label for="contraseña">
                                Contraseña <i class="bi bi-eye"></i>
                            </label>

                            <input
                                type="password"
                                id="contraseña"
                                minlength="3"
                                maxlength="20"
                                placeholder="Ingrese su contraseña"
                                required
                            >

                            <button type="submit" class="btn-iniciarSesion">
                                Iniciar sesión
                            </button>

                        </form>
                    </div>

                    <div class="OR">
                        <a href="pagesLogin/olvidoContra.html">
                            Olvidé mi contraseña
                        </a>

                        <a href="pagesLogin/registrarse.html">
                            Registrarse
                        </a>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/kronos.js"></script>

</body>
</html>
