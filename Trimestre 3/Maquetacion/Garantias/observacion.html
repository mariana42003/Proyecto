<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="../css/observacion-garantias.css">

    <title>Consultar Garantía</title>
</head>

<body class="fondo">

<input type="checkbox" id="menu">

<label for="menu" class="menus">
    <i class="bi bi-list"></i>
</label>

<div class="contenedor container-fluid p-0">

    <!-- HEADER -->
    <header class="w-100">

        <h1 class="nombreUsuario">
            <i class="bi bi-person-circle"></i>
        </h1>

        <img src="../img/logo.png" alt="Logo">

        <div class="cerrarSesion">
                <a href="#" id="btnSalir">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>

    </header>

    <!-- CONTENEDOR DEL ASIDE Y MAIN -->
    <div class="d-flex align-items-stretch w-100 posicion-contenedor">

        <!-- ASIDE -->
    <aside>
        <div class="opciones">
          <!-- -- PANEL DE CONTROL -- -->

          <a href="../Panel.html">
            <i class="bi bi-eye"></i>
            Panel de control
          </a>

          <!-- -- GESTION DE INVENTARIO -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-inventario"
              class="radio-check"
            />

            <label for="check-inventario" class="titulo-menu">
              <i class="bi bi-box-seam"></i>
              Gestión de Inventario
            </label>

            <div class="submenu">
              <a href="../gestionInventario/stock.html">
                <i class="bi bi-journal-text"></i>
                Stock
              </a>

              <a href="../gestionInventario/reportes.html">
                <i class="bi bi-pencil"></i>
                Reportes
              </a>
            </div>
          </div>

          <!-- -- MOVIMIENTOS DE ENTRADA Y SALIDA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-movimientos"
              class="radio-check"
            />

            <label for="check-movimientos" class="titulo-menu">
              <i class="bi bi-cart"></i>
              Movimientos de entrada/salida
            </label>

            <div class="submenu">
              <a href="../Movimientos-index/Entrada.html">
                <i class="bi bi-box-arrow-in-down"></i>
                Registro de Entradas
              </a>

              <a href="../Movimientos-index/Salida.html">
                <i class="bi bi-box-arrow-up"></i>
                Registro de Salidas
              </a>
            </div>
          </div>

          <!-- -- PROVEEDORES -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-proveedores"
              class="radio-check"
            />

            <label for="check-proveedores" class="titulo-menu">
              <i class="bi bi-people"></i>
              Proveedores
            </label>

            <div class="submenu">
              <a href="../Pagesjefe/registrarProveedore.html">
                <i class="bi bi-card-list"></i>
                Registrar
              </a>


            </div>
          </div>

          <!-- -- ORDEN DE COMPRA -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-ordenes"
              class="radio-check"
            />

            <label for="check-ordenes" class="titulo-menu">
              <i class="bi bi-file-earmark-arrow-down"></i>
              Generar orden de compra
            </label>

            <div class="submenu">
              <a href="../pagesJefe/historialCompras.html">
                <i class="bi bi-journal-check"></i>
                Historial compras
              </a>

              <a href="../pagesJefe/materialCantidad.html">
                <i class="bi bi-boxes"></i>
                Asociar materiales
              </a>

              <a href="../pagesJefe/verificarEstado.html">
                <i class="bi bi-arrow-repeat"></i>
                Verificar estado
              </a>
            </div>
          </div>

          <!-- -- GARANTIAS -- -->

          <div class="item-acordeon">
            <input
              type="radio"
              name="menu-acordeon"
              id="check-garantias"
              class="radio-check"
            />

            <label for="check-garantias" class="titulo-menu">
              <i class="bi bi-shield-check"></i>
              Garantías
            </label>

            <div class="submenu">
              <a href="../Garantias/SolicitudGarantias.html">
                <i class="bi bi-pencil-square"></i>
                Solicitudes de Garantía
              </a>

              <a href="../Garantias/consultarOrden.html">
                <i class="bi bi-file-earmark-text"></i>
                Consultar Orden
              </a>

              <a href="../Garantias/historial-garantias.html">
                <i class="bi bi-clock-history"></i>
                Historial
              </a>

              <a href="../Garantias/estado-gar-provee.html">
                <i class="bi bi-arrow-left-right"></i>
                Estado Garantía
              </a>
            </div>
          </div>
        </div>
      </aside>
      

        <!-- MAIN -->
        <main class="flex-grow-1 p-3 p-md-5 overflow-hidden">

            <div class="row">
        <div class="col-lg-10 mx-auto">
            <div class="text-center py-2 mb-4 banner-observacion">
                <h2 class="mb-0 fs-3 text-dark">Registro de Observacion de Garantía</h2>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold fs-5 letra-ob">Material:</label>
                    <input type="text" class="form-control input-observacion" placeholder="Ej: Tornillos">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold fs-5 letra-ob">Nombre Cliente:</label>
                    <input type="text" class="form-control input-observacion" placeholder="Ej: Mauricio">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold fs-5 letra-ob">Observación (Obligatorio):</label>
                <textarea class="form-control textarea-observacion" rows="6" placeholder="Ej: El material esta dañado"></textarea>
            </div>
            <div class="row">
     <div class="d-flex justify-content-end">
                <button class="btn btn-enviar px-5" data-bs-toggle="modal" data-bs-target="#modalExito">
                    Cerrar
                </button>
            </div>
</div>
<div class="modal fade" id="modalExito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-body text-center p-5">
                <img src="../img/logo.png" alt="Logo" class="mb-4 modal-logo">
                
                <h2 class="fw-bold text-dark mb-4 mt-2">SU GARANTIA FUE EXITOSA</h2>
                
                <div class="check-container-modal mx-auto mb-4">
                    <i class="bi bi-check-lg"></i>
                </div>
                
                <a href="../Garantias/historial-garantias.html"><button type="button" class="btn btn-cerrar-modal" data-bs-dismiss="modal">Cerrar</button></a>
            </div>
        </div>
    </div>
</div>

           
        </div>
    </div>

        </main>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/jefe-proveedores.js"></script>


</body>
</html>
