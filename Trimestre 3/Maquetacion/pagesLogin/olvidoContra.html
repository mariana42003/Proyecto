<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center my-4">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-11 col-lg-9 col-xl-8">
                 <div class="cajaGrande shadow-lg rounded-4 overflow-hidden bg-white">
                       <div class="row g-0 align-items-stretch"> 

                        

                <div class=" col-12 col-md-7 p-4 p-sm-5 d-flex flex-column justify-content-center  shadow-sm">
                    <div class="logoLogin">
                    <img  class="img-fluid" style="max-height: 100px; max-width: 70%; align-items: center;" src="../img/logo.png" alt="Logo" >
                    </div>
                    <hr>
                    <h1>Recuperación de contraseña</h1>

                    <form action="../pagesLogin/restablecimientoContra.html">
                        <label for="correo">Digite su correo electrónico</label>
                        <input type="email" id="correo" placeholder=" Ingrese su correo electrónico" required> 
                        <div class="btn-botones btn-alarmasCorreo ">
                        <button type="submit" class="btn-alarmasCorreo">Enviar</button>
                        </div>
                    </form>
                 
                    <div class="text-center mt-3 ">
                         <a href="../indexLoginJefe.html" class="btn-volver-inicio btn btn-light border w-100 py-2 fw-bold text-primary">Volver al inicio</a>
                    </div>
                </div>
                  <div class="col-md-5 d-none d-md-block p-0"> 
                            <img src="../img/olvidoContra.png" alt="Herramientas" class="img-fluid w-100 h-100" style="object-fit: cover;"> 
                        </div>
 </div>
            </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/kronos.js"></script></body>
</html>
