<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="../css/styleLogin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>


    <div class="nuevaContraseña">
              <img src="../img/logo.png" alt="Logo Kronos">
        
    <div class="volverAnterior">
      <a href="../pagesLogin/restablecimientoContra.html" class="btn-volver">
        <i class="bi bi-chevron-double-left"></i>   
        Volver
      </a>
    </div>

    <hr><br><br>

    <h1>Restablecimiento de contraseña</h1>
    <div class="cajaGrande">
 <form action="../indexLoginJefe.html">
    <div class="pinRestablecimiento">
        
            <label for="usuario">Usuario   <i class="bi bi-person-fill"></i></label><br>
            <input type="text" id="usuario"  placeholder="Ingrese su NIT o numero de identificacion" required>

            <br><br>

            <label for="pin">PIN de restablecimiento   <i class="bi bi-shield-lock-fill"></i></label> <br>
            <input type="text" id="pin"  placeholder="Ingrese el PIN de restablecimiento" required>

        
    </div>

     <div class="lineaVertical"></div>

    <div class="ingresarNuevaContraseña">
        
            <label for="nuevaContra">Nueva contraseña   <i class="bi bi-key-fill"></i></label> <br>
            <input type="password" id="nuevaContra"  placeholder="Ingrese su nueva contraseña" required>

            <br><br>

            <label for="confirmarContra">Confirmar nueva contraseña   <i class="bi bi-key-fill"></i></label> <br>
            <input type="password" id="confirmarContra"  placeholder="Confirme su nueva contraseña" required>

        
    </div>
   
    </div>

    <button type="submit">Confirmar cambios</button>
 </form>
    </div>

    
    
</body>
</html>
