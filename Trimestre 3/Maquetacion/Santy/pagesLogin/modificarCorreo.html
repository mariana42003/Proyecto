<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Correo</title>
    <link rel="stylesheet" href="../css/styleLogin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>


<div class="arreglarCorreo">


    <img src="../img/logo.png" alt="">

    <div class="volverAnterior">
      <a href="../pagesLogin/restablecimientoContra.html" class="btn-volver">
        <i class="bi bi-chevron-double-left"></i>   
        Volver
      </a>
    </div>


    <div class="decoracion">

    

    <h1> Actualizar correo electrónico

   </h1>
  

   </div>

<p>Si ya no tiene acceso a su correo electrónico, complete el formulario para actualizar la dirección de correo asociada a su cuenta.</p>
   <form action="../pagesLogin/olvidoContra.html">

     <label for="usuario">Usuario  <i class="bi bi-person-circle"></i></label>
         <input type="text" id="usuario"  placeholder="Ingrese su NIT o numero de identificacion" required>

         <br><br>
    <label for="correo">Nuevo correo electronico  <i class="bi bi-envelope-plus"></i></label>  
        <input type="email" id="correo" placeholder="Ingrese su correo electronico" required>  
        <br><br>
      <label for="correo">Confirmar nuevo correo electronico <i class="bi bi-envelope-exclamation-fill"></i></label>  
        <input type="email" id="correo" placeholder="Ingrese su correo electronico" required>      
        

       <button type="submit"> ⮊  Actualización de correo electrónico  ⮈</button>






   </form>

</div>
   
</body>
</html>
